# ~/.config/agent-swap/config.toml. Every key is optional.
# The values for scalar keys are the defaults.
threshold = 95              # percent of any usage window that starts a switch; must be > 0 and <= 100
switch_back_delay = "10m"   # wait after a blocked harness's reset before going back to it; must be >= 0
switch_back_timeout = "1h"  # max wait for the ready file before a forced switch back at idle; must be > 0
cooldown = "1h"             # block period after a limit error with no known reset; must be >= 0
context_max_bytes = 60000   # cap on the conversation text given to the next harness (newest kept); must be > 0
poll = "30s"                # must be > 0
notify = true               # macOS notification on each switch
# statusline_cmd = "..."    # default: statusLine.command from ~/.claude/settings.json
# state_dir = "~/.local/state/agent-swap"   (absolute path)

# Harnesses, in preference order. agent-swap runs the first one that is not blocked.
# Without any [[harness]] table, the order is: claude, then claude on the target
# from default_target (or --target).
# Keys: name (unique), kind (claude|codex|pi|opencode|agy), bin (default: the kind,
# or claude_bin for claude), args (always passed), target (claude only),
# threshold and cooldown (override the top-level values).

[[harness]]                 # Claude Code on your subscription: usage windows 5h and 7d
name = "claude"
kind = "claude"

[[harness]]                 # Codex CLI on your ChatGPT plan: usage windows primary and secondary
name = "codex"
kind = "codex"
args = ["-m", "gpt-5.5"]

[[harness]]                 # pi with DeepSeek: no usage windows, a limit error blocks it for the cooldown
name = "pi-deepseek"
kind = "pi"
args = ["--provider", "deepseek", "--model", "deepseek-chat"]
cooldown = "30m"

[[harness]]                 # Claude Code on API billing through [targets.gateway]: the last resort
name = "claude-api"
kind = "claude"
target = "gateway"

# The key is never stored here: key_cmd prints it on demand (Claude Code apiKeyHelper).
[targets.gateway]           # any Anthropic-compatible endpoint serving <base_url>/v1/messages
base_url = "https://llm-gateway.example.com/anthropic"
key_cmd  = "security find-generic-password -s llm-gateway -w"   # required

# Message templates. Placeholders: {from} {to} {file} {notes} {context} {reason} {pct} {resets_at}
# handoff_message = "..."   # before a switch down the list; must include {file}
# return_message = "..."    # before a switch back up the list; must include {file}
# resume_message = "..."    # first prompt to the next harness; names the {context} file
